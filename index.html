<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Cauca</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f4f7fb;
      color:#1f2937;
    }

    .hero{
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:2rem;
      background:linear-gradient(135deg,#001F77,#2563eb);
      color:white;
    }

    h1{
      font-size:3rem;
      margin-bottom:1rem;
    }

    p{
      max-width:650px;
      font-size:1.2rem;
      line-height:1.6;
      margin-bottom:2rem;
    }

    .btn{
      display:inline-block;
      padding:14px 28px;
      background:white;
      color:#001F77;
      text-decoration:none;
      border-radius:8px;
      font-weight:bold;
    }

    .btn:hover{
      background:#e5e7eb;
    }
  </style>
</head>

<body>

<section class="hero">
  <h1>Proyecto Cauca</h1>
  <p>
    Welcome to our GitHub Pages website.
    This page will become our personalized homepage.
  </p>

  <a class="btn" href="https://github.com/proyectocauca/material">
    View Repository
  </a>
</section>

</body>
</html>
